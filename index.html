<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Laboratoire DI3D - Pièce 01</title>

    <script type="module"
        src="https://ajax.googleapis.com/ajax/libs/model-viewer/4.1.0/model-viewer.min.js">
    </script>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            text-align: center;
            background: #f5f5f5;
        }

        h1 {
            margin-top: 25px;
        }

        model-viewer {
            width: 100%;
            height: 65vh;
            background-color: Black;
        }

        .info {
            padding: 15px;
        }
    </style>
</head>

<body>

    <h1>Laboratoire DI3D</h1>

    <div class="info">
        <h2>Pièce 01</h2>
        <p>Manipulez la pièce pour mieux comprendre sa géométrie.</p>
    </div>

    <model-viewer
        src="01.glb"
        camera-controls
        touch-action="pan-y"
        shadow-intensity="1"
        auto-rotate>
    </model-viewer>

    <p>
        🖱️ Faites tourner la pièce &nbsp; | &nbsp;
        🔍 Utilisez le zoom
    </p>

</body>
</html>
